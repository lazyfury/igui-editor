[package]
name = "igui-editor"
version = "0.1.0"
edition = "2021"
# Hosts `igui_winit` / `igui_backend_wgpu`, whose dependency graph needs 1.85.
rust-version = "1.85"
publish = false
description = "A compact, square-cornered text/Markdown editor built on igui"

[lib]
name = "igui_editor"
path = "src/lib.rs"

[[bin]]
name = "igui-editor"
path = "src/main.rs"

[features]
# The headless self-check is a development/verification seam. Release bundles
# are built with `--no-default-features` so the recorder, profiler and headless
# host are not linked into the shipped binary.
default = ["selfcheck"]
selfcheck = [
    "dep:igui_backend_recording",
    "dep:igui_headless",
    "dep:igui_profile",
]
# Benchmark target: reuses the headless recorder, no window required.
bench = ["selfcheck"]

[[bench]]
name = "markdown"
path = "benches/markdown.rs"
harness = false
required-features = ["bench"]

[dependencies]
# The UI is built on the workspace's backend-neutral layers (path deps: this
# app lives outside the igui checkout and never modifies it).
igui_core = { path = "../igui/crates/core/igui_core" }
igui_render = { path = "../igui/crates/core/igui_render" }
igui_scene = { path = "../igui/crates/core/igui_scene" }
igui_ui = { path = "../igui/crates/core/igui_ui" }
igui_font = { path = "../igui/crates/assets/igui_font" }
# Application runtime + native platform plugins.
igui_app = { path = "../igui/crates/app/igui_app" }
igui_winit = { path = "../igui/crates/window/igui_winit" }
igui_backend_wgpu = { path = "../igui/crates/platform/wgpu/igui_backend_wgpu" }
# Markdown -> block model for the preview pane (M2).
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
# Headless pipeline: `--selfcheck` records the DrawList and asserts on it.
igui_headless = { path = "../igui/crates/app/igui_headless", optional = true }
igui_backend_recording = { path = "../igui/crates/platform/recording/igui_backend_recording", optional = true }
igui_profile = { path = "../igui/crates/debug/igui_profile", optional = true }
portable-pty = "0.9"
vt100 = "0.18"
# Native file dialogs (M2). `rfd` keeps its platform backend behind cfg:
# Linux needs the XDG portal backend, macOS/Windows use their system APIs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSDocumentController",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSArray",
    "NSData",
    "NSObject",
    "NSString",
    "NSURL",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }


# Independent app: not a member of the igui workspace, so the engine's gate
# stays untouched. It only consumes the crates above through path deps.
[workspace]

# Release: one codegen unit + fat LTO for runtime, stripped symbols and abort
# panics for a smaller bundle. The headless self-check is not part of the
# shipped bundle (see the `selfcheck` feature).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep the app's hot paths at `opt-level = 3`; size-optimize dependency code
# (wgpu, winit, parser crates) where steady-state throughput matters less.
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.igui_app]
opt-level = 3
[profile.release.package.igui_backend_wgpu]
opt-level = 3
[profile.release.package.igui_core]
opt-level = 3
[profile.release.package.igui_font]
opt-level = 3
[profile.release.package.igui_render]
opt-level = 3
[profile.release.package.igui_scene]
opt-level = 3
[profile.release.package.igui_ui]
opt-level = 3
[profile.release.package.igui_winit]
opt-level = 3
