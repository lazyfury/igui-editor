name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Check out the editor
        uses: actions/checkout@v4
        with:
          path: igui-editor

      - name: Check out the pinned engine
        uses: actions/checkout@v4
        with:
          repository: lazyfury/igui
          ref: v0.6.0
          path: igui

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Run the gate
        working-directory: igui-editor
        run: scripts/check.sh
